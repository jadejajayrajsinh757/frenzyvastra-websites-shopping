<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Product</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        nav { background-color: #222; padding: 15px 30px; display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; font-size: 15px; }
        nav a:hover { text-decoration: underline; }
        main { padding: 40px; max-width: 500px; }
        h2 { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 25px; background-color: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #555; }
        .current-img { margin-bottom: 10px; }
        .current-img img { width: 100px; height: 100px; object-fit: cover; }
    </style>
</head>
<body>

<nav>
    <a href="{% url 'seller_dashboard' %}">Dashboard</a>
    <a href="{% url 'seller_add_product' %}">Add Product</a>
    <a href="{% url 'seller_products' %}">Products</a>
    <a href="{% url 'logout' %}" style="margin-left: auto;">Logout</a>
</nav>

<main>
    <h2>Update Product</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Title</label>
        <input type="text" name="product_title" value="{{ product.product_title }}" required>

        <label>Price</label>
        <input type="number" name="product_price" step="0.01" value="{{ product.product_price }}" required>

        <label>Description</label>
        <textarea name="product_description" rows="4" required>{{ product.product_description }}</textarea>

        <label>Available Quantity</label>
        <input type="number" name="available_qty" value="{{ product.available_qty }}" required>

        <label>Is Active</label>
        <input type="checkbox" name="is_active" {% if product.is_active %}checked{% endif %}>

        <label>Current Image</label>
        <div class="current-img">
            <img src="{{ product.product_img.url }}" alt="current image">
        </div>

        <label>Change Image (optional)</label>
        <input type="file" name="product_img" accept="image/*">

        <button type="submit">Update Product</button>
    </form>
</main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        nav { background-color: #222; padding: 15px 30px; display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; font-size: 15px; }
        nav a:hover { text-decoration: underline; }
        main { padding: 40px; }
        h2 { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #333; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        a.btn { padding: 6px 14px; background-color: #333; color: white; text-decoration: none; border-radius: 4px; }
        a.btn:hover { background-color: #555; }
    </style>
</head>
<body>

<nav>
    <a href="{% url 'seller_dashboard' %}">Dashboard</a>
    <a href="{% url 'seller_add_product' %}">Add Product</a>
    <a href="{% url 'seller_products' %}">Products</a>
    <a href="{% url 'logout' %}" style="margin-left: auto;">Logout</a>
</nav>

<main>
    <h2>All Products</h2>
    <table>
        <tr>
            <th>Title</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Active</th>
            <th>Action</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product.product_title }}</td>
            <td>Rs. {{ product.product_price }}</td>
            <td>{{ product.available_qty }}</td>
            <td>{{ product.is_active }}</td>
            <td><a class="btn" href="{% url 'seller_update_product' product.product_id %}">Update</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No products found.</td></tr>
        {% endfor %}
    </table>
</main>

</body>
</html>
